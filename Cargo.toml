[package]
name = "todo_ratatui"
version = "1.2.0"
edition = "2024"
# MSRV = máximo dos MSRV do conjunto de deps (ratatui 0.30.2, crossterm 0.29,
# chrono 0.4, serde 1), medido com `cargo tree` pelo researcher. Não é o 1.85
# do `edition 2024`.
rust-version = "1.88"
description = "Lista de tarefas em TUI (ratatui), com lixo que repõe, busca, prioridades e import/export CSV/JSON"
repository = "https://github.com/SyscallBrain/todo-ratatui"
readme = "README.md"
license = "MIT"
authors = ["SyscallBrain"]
keywords = ["todo", "tui", "ratatui", "task-manager", "terminal"]
categories = ["command-line-utilities"]
# Sem publicação no crates.io (decisão de âmbito da v1): `publish = false` é o
# que impede um `cargo publish` acidental, não a ausência de metadados.
publish = false

[dependencies]
# `chrono` com as features default: `clock`/`now`/`std` são precisos para
# `Local::now()`; `serde` é dep opcional, ligada explicitamente.
chrono = { version = "0.4", features = ["serde"] }
# Sem a feature `event-stream` (arrasta `futures-core` e não é usada: só
# `event::read`/`poll`). As features default ficam.
crossterm = "0.29"
# `csv` 1.4: sem secção `[features]` no crate, logo não há nada a ligar
# (`serde` é dependência normal). Só entrou agora, no T4, para não repetir as
# dependências mortas do protótipo.
csv = "1.4"
# `dirs` 6 é a dep que o ponto 8 do ADR nomeia. Só se usa `data_dir()`
# (`$XDG_DATA_HOME` → `~/.local/share`): as tarefas são **dados**, não
# configuração, logo não vão para `~/.config` (que costuma estar em dotfiles).
dirs = "6"
# `default-features = false` aqui deixaria o crate sem `CrosstermBackend`.
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Largura de caracteres em colunas. Já vinha na árvore (é dependência do
# `ratatui`), mas passou a ser usada directamente: o T6 mede colunas para
# cortar títulos, centrar texto e asserir a coluna do cursor — com a mesma
# regra do gerador dos goldens, e **não** com `chars().count()` (§8).
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
